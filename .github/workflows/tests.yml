name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest yt-dlp
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'Windows'
        name: Install pinned FFmpeg package
        run: |
          # The metadata endpoint can return 503 while the exact package is available.
          $packageRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-package'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          $packagePath = Join-Path $packageRoot 'ffmpeg.9.0.1.nupkg'
          Invoke-WebRequest -Uri 'https://community.chocolatey.org/api/v2/package/ffmpeg/9.0.1' -OutFile $packagePath -TimeoutSec 120 -MaximumRetryCount 2 -RetryIntervalSec 5
          $expectedHash = '157C12D0609BE46F17C8ABF7444E6306150DB8FE8AD3E62CD24D60AD0A98D770'
          if ((Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'FFmpeg package checksum mismatch'
          }
          choco install ffmpeg --version 9.0.1 --source $packageRoot -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg package installation failed' }
      - run: ffmpeg -version
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m compileall -q skill/scripts scripts tests
      - run: python scripts/build-plugin.py --check
      - run: python scripts/build-agent-docs.py --check
      - run: git diff --check
